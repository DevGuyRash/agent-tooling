<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Notes — Checkout</title><link rel="stylesheet" href="/shared.css"></head><body><header><span class="brand">Field Notes</span><span class="muted">Demo checkout</span></header><main style="max-width:620px"><div class="eyebrow">Your order</div><h1>Ready for your next idea.</h1><section class="card"><h2>Field notebook</h2><p>A durable notebook for sketches, observations, and the unexpected.</p><dl><dt>Unit price</dt><dd>$42.00</dd></dl><form id="checkout"><label>Quantity<input type="number" id="quantity" min="1" max="10" value="2" required></label><dl><dt>Total</dt><dd><output id="total" aria-label="Order total">$84.00</output></dd></dl><button class="primary" type="submit">Complete purchase</button></form><p id="error" role="status"></p></section><p class="muted">This is a synthetic purchase. No payment account is connected.</p></main><script>
const quantity=document.querySelector('#quantity'),total=document.querySelector('#total');
quantity.addEventListener('input',()=>{total.value=`$${(Number(quantity.value)*42).toFixed(2)}`;});
document.querySelector('#checkout').addEventListener('submit',async event=>{event.preventDefault();const response=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({quantity:Number(quantity.value)})});const result=await response.json();if(response.ok)location.assign(result.url);else document.querySelector('#error').textContent=result.error;});
</script><footer>Field Notes · Synthetic checkout</footer></body></html>
