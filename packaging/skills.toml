# Single source of truth for packaged plugin-local skill binaries.
# Add one [skills.<id>] entry per packaged launcher/binary pair.
# Repo scripts and CI both consume required_platforms/ci_platforms from this manifest.
# Each skill declares the exact pre-packaged platform set it supports. Most
# current entries ship Linux only; exceptions remain explicit per skill.

[skills.docker_architect_compose]
package = "docker-architect-compose"
binary = "docker-architect-compose"
skill_dir = "plugins/docker-architect/skills/docker-architect"
launcher = "scripts/docker-architect-compose"
smoke_args = ["--help"]
required_platforms = ["linux-x86_64"]
ci_platforms = ["linux-x86_64"]

[skills.docker_architect_image]
package = "docker-architect-image"
binary = "docker-architect-image"
skill_dir = "plugins/docker-architect/skills/docker-architect"
launcher = "scripts/docker-architect-image"
smoke_args = ["--help"]
required_platforms = ["linux-x86_64"]
ci_platforms = ["linux-x86_64"]

[skills.friction_render_table]
package = "render-table"
binary = "render-table"
skill_dir = "plugins/friction-diagnostics/skills/friction-diagnostics"
launcher = "scripts/render-table.sh"
smoke_args = ["--help"]
required_platforms = ["linux-x86_64"]
ci_platforms = ["linux-x86_64"]

# Vendored copies of shared skill scripts. Skills are self-contained
# distribution units on every harness (Agent Skills spec), so shared code is
# committed as real per-skill copies; the source below is the single source
# of truth and `package_skills.py vendor` keeps targets byte-identical
# (--sync to refresh, default mode checks and fails on drift).

[[vendor.copies]]
source = "plugins/friction-diagnostics/skills/friction-diagnostics/scripts/_common.sh"
targets = ["plugins/friction-diagnostics/skills/friction-mend/scripts/_common.sh"]

[[vendor.copies]]
source = "plugins/friction-diagnostics/skills/friction-diagnostics/scripts/query-friction.sh"
targets = ["plugins/friction-diagnostics/skills/friction-mend/scripts/query-friction.sh"]

[[vendor.copies]]
source = "plugins/friction-diagnostics/skills/friction-diagnostics/scripts/generate-report.sh"
targets = ["plugins/friction-diagnostics/skills/friction-mend/scripts/generate-report.sh"]

[[vendor.copies]]
source = "plugins/friction-diagnostics/skills/friction-diagnostics/scripts/build-index.sh"
targets = ["plugins/friction-diagnostics/skills/friction-mend/scripts/build-index.sh"]

[[vendor.copies]]
source = "plugins/friction-diagnostics/skills/friction-diagnostics/friction-event-schema.json"
targets = ["plugins/friction-diagnostics/skills/friction-mend/friction-event-schema.json"]

[[vendor.copies]]
source = "plugins/friction-diagnostics/skills/friction-diagnostics/scripts/lifecycle.py"
targets = ["plugins/friction-diagnostics/skills/friction-mend/scripts/lifecycle.py"]
