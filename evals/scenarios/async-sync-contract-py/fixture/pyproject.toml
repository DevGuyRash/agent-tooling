[project]
name = "shelftag"
version = "1.4.0"
description = "Shelf-label text for the Marktgasse co-op's stores"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shelftag = "shelftag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shelftag"]
