[project]
name = "dockctl"
version = "0.4.0"
description = "Ops tools for the Riverbend Bikes dock network"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dockctl = "dockctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dockctl"]
