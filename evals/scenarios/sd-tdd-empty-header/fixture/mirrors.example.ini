# Mirrors kept by mirrorsync. Copy to /etc/mirrorsync/mirrors.ini and edit.

[defaults]
interval = 6h
retries = 3
exclude =
    *.iso
    *.img

[debian]
url = https://deb.example.org/debian
dest = /srv/mirror/debian

[ubuntu-ports]
url = https://ports.example.org/ubuntu-ports
dest = /srv/mirror/ubuntu-ports
interval = 12h
