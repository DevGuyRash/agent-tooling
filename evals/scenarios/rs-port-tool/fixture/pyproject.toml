[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reqstat"
version = "1.4.0"
description = "Summarize logfmt access logs from the edge proxies"
requires-python = ">=3.9"

[project.scripts]
reqstat = "reqstat.cli:main"

[tool.setuptools]
packages = ["reqstat"]
